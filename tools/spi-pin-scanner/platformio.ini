; Author: Dibyendu Mondal (https://github.com/dib-00)
; =============================================================================
;  SPI panel pin scanner (KT-018N105-2023 16-pin and other unknown SPI panels)
;  ESP32-C3 SuperMini:  pio run -e c3 -t upload --upload-port COM16
;  NodeMCU-32S:         pio run -e nodemcu32s -t upload --upload-port COM8
; =============================================================================

[env:c3]
platform      = espressif32 @ ^6.9.0
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
build_flags   =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:nodemcu32s]
platform      = espressif32 @ ^6.9.0
board         = nodemcu-32s
framework     = arduino
monitor_speed = 115200
