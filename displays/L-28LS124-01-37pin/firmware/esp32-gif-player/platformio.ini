; Author: Dibyendu Mondal (https://github.com/dib-00)
; =============================================================================
;  L-28LS124-01 (2.8", 240x320, ST7789V, 37-pin, 8-bit 8080 parallel)
;  GIF / image player on a NodeMCU-32S (ESP32-WROOM-32)
;
;  Build + flash:  pio run -t upload --upload-port COM8
;  Monitor:        pio device monitor -p COM8
; =============================================================================

[env:nodemcu32s]
platform          = espressif32 @ ^6.9.0
board             = nodemcu-32s
framework         = arduino
monitor_speed     = 115200

; 1.5 MB app + 2.4 MB LittleFS (about 15 full-screen frames)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Web UI compiled into the firmware image
board_build.embed_txtfiles = web/index.html

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.7.0

; TFT_eSPI configuration: identical to the verified esp32-37pin-st7789 test
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_PARALLEL_8_BIT=1
    -D TFT_CS=33       ; LCD 4  CS
    -D TFT_DC=15       ; LCD 5  RS (D/C)
    -D TFT_WR=4        ; LCD 6  WR
    -D TFT_RD=2        ; LCD 7  RD
    -D TFT_RST=32      ; LCD 8  RESET
    -D TFT_D0=12       ; LCD 17 DB8
    -D TFT_D1=13       ; LCD 18 DB9
    -D TFT_D2=26       ; LCD 19 DB10
    -D TFT_D3=25       ; LCD 20 DB11
    -D TFT_D4=17       ; LCD 21 DB12
    -D TFT_D5=16       ; LCD 22 DB13
    -D TFT_D6=27       ; LCD 23 DB14
    -D TFT_D7=14       ; LCD 24 DB15
    -D TFT_INVERSION_OFF=1   ; this panel shows a negative image with INVON
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
