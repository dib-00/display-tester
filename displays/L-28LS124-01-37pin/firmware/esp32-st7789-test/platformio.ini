; Author: Dibyendu Mondal (https://github.com/dib-00)
; =============================================================================
;  F0-28LS124-01 / L-28LS124-01 (2.8", 240x320, ST7789V, 37-pin, 8-bit 8080)
;  on a NodeMCU-32S (ESP32-WROOM-32) — display test
;  Build + flash:  pio run -t upload --upload-port COMx
;  Monitor:        pio device monitor -p COMx
; =============================================================================

[env:nodemcu32s]
platform      = espressif32 @ ^6.9.0
board         = nodemcu-32s
framework     = arduino
monitor_speed = 115200
lib_deps      = bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_PARALLEL_8_BIT=1

    ; Control lines (LCD pin -> GPIO)
    -D TFT_CS=33       ; LCD 4  CS
    -D TFT_DC=15       ; LCD 5  RS (D/C)
    -D TFT_WR=4        ; LCD 6  WR
    -D TFT_RD=2        ; LCD 7  RD
    -D TFT_RST=32      ; LCD 8  RESET

    ; 8-bit data bus. TFT_eSPI requires GPIO 0-31 for data on the ESP32.
    -D TFT_D0=12       ; LCD 17 DB8
    -D TFT_D1=13       ; LCD 18 DB9
    -D TFT_D2=26       ; LCD 19 DB10
    -D TFT_D3=25       ; LCD 20 DB11
    -D TFT_D4=17       ; LCD 21 DB12
    -D TFT_D5=16       ; LCD 22 DB13
    -D TFT_D6=27       ; LCD 23 DB14
    -D TFT_D7=14       ; LCD 24 DB15

    ; Unidentified flex signals (probably IM mode straps / TE), handled in
    ; main.cpp: LCD 9 -> GPIO18, LCD 10 -> GPIO19, LCD 11 -> GPIO21,
    ; LCD 12 -> GPIO22, LCD 26 -> GPIO23.

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D SMOOTH_FONT=1

    ; TFT_eSPI's ST7789 init always sends INVON; this panel needs INVOFF (0x20)
    -D TFT_INVERSION_OFF=1

    ; Uncomment if red and blue are swapped:
    ; -D TFT_RGB_ORDER=0
