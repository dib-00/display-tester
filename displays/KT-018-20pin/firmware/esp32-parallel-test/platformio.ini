;  KT-018 universal 20-pin (1.8", 128x160, 8-bit 8080 parallel) — pin scanner
;  on a NodeMCU-32S (ESP32-WROOM-32)
;  Build + flash:  pio run -t upload --upload-port COMx
;  Monitor:        pio device monitor -p COMx
; =============================================================================

[env:nodemcu32s]
platform      = espressif32 @ ^6.9.0
board         = nodemcu-32s
framework     = arduino
monitor_speed = 115200
