; Author: Dibyendu Mondal (https://github.com/dib-00)
; =============================================================================
;  KT-018N105-2023 16-pin (Nokia 105 2023 replacement, 4-wire SPI)
;  GIF / image player on an ESP32-C3 SuperMini
;
;  Build + flash:  pio run -t upload --upload-port COM16
;  Monitor:        pio device monitor -p COM16
; =============================================================================

[env:c3]
platform          = espressif32 @ ^6.9.0
board             = esp32-c3-devkitm-1
framework         = arduino
monitor_speed     = 115200

; 4 MB flash: 1.25 MB app (x2, OTA layout) + ~1.4 MB LittleFS for animations
board_build.partitions = default.csv
board_build.filesystem = littlefs

; Web UI compiled into the firmware image
board_build.embed_txtfiles = web/index.html

lib_deps =
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.7.0
    adafruit/Adafruit GFX Library @ ^1.11.9

build_flags =
    ; native USB serial on the SuperMini
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
